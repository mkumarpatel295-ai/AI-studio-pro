<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Studio Pro</title>

  <!-- Three.js Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
    body { background: #08080a; color: #e1e1e6; height: 100vh; overflow: hidden; display: flex; }

    /* Small 3D Background Canvas */
    #canvas-container { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; pointer-events: none; }

    /* Sidebar */
    #sidebar {
      position: fixed; left: -220px; top: 0; width: 220px; height: 100%;
      background: rgba(15, 15, 20, 0.95); backdrop-filter: blur(8px);
      z-index: 20; transition: 0.3s ease; padding: 15px; border-right: 1px solid #222;
    }
    #sidebar.active { left: 0; }
    .sidebar-title { font-size: 0.85rem; color: #888; margin-bottom: 12px; font-weight: 600; text-transform: uppercase; }
    .history-item { padding: 8px 10px; background: #181820; border-radius: 6px; font-size: 0.8rem; margin-bottom: 6px; color: #ccc; cursor: pointer; }

    /* Main UI Container */
    #main-app { position: relative; z-index: 10; display: flex; flex-direction: column; width: 100%; height: 100vh; padding: 12px; max-width: 600px; margin: 0 auto; }

    /* Header */
    .header { display: flex; align-items: center; justify-content: space-between; padding-bottom: 10px; border-bottom: 1px solid rgba(255,255,255,0.08); }
    .menu-btn { background: #1a1a24; border: 1px solid #333; color: #fff; padding: 6px 10px; border-radius: 6px; cursor: pointer; font-size: 0.85rem; }
    .app-title { font-size: 1rem; font-weight: 700; color: #a855f7; }

    /* Chat Area */
    .chat-container { flex: 1; overflow-y: auto; padding: 12px 0; display: flex; flex-direction: column; gap: 8px; scrollbar-width: none; }
    .chat-container::-webkit-scrollbar { display: none; }

    .msg { max-width: 85%; padding: 8px 12px; border-radius: 12px; font-size: 0.82rem; line-height: 1.4; word-wrap: break-word; white-space: pre-wrap; }
    .msg.ai { background: rgba(22, 22, 32, 0.9); border: 1px solid #2e2e3d; align-self: flex-start; color: #d1d5db; }
    .msg.user { background: #6366f1; color: #fff; align-self: flex-end; border-bottom-right-radius: 2px; }

    /* Compact Input Bar */
    .input-bar {
      display: flex; align-items: center; gap: 6px; background: #12121a;
      padding: 6px 10px; border-radius: 25px; border: 1px solid #282836; margin-top: 5px;
    }
    .icon-btn { background: transparent; border: none; color: #9ca3af; font-size: 1.1rem; cursor: pointer; padding: 4px; display: flex; align-items: center; justify-content: center; }
    .input-bar input { flex: 1; background: transparent; border: none; outline: none; color: #fff; font-size: 0.85rem; padding: 4px 6px; }
    .send-btn { background: #6366f1; color: #fff; border: none; width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 0.8rem; }
  </style>
</head>
<body>

  <!-- Small 3D Cube Canvas -->
  <div id="canvas-container"></div>

  <!-- Sidebar -->
  <div id="sidebar">
    <div class="sidebar-title">Chat History</div>
    <div id="historyList">
      <div class="history-item">New Conversation</div>
    </div>
  </div>

  <!-- Main App View -->
  <div id="main-app">
    <div class="header">
      <button class="menu-btn" onclick="document.getElementById('sidebar').classList.toggle('active')">☰ Menu</button>
      <div class="app-title">AI Studio Pro</div>
      <div style="width: 50px;"></div>
    </div>

    <!-- Chat Stream -->
    <div class="chat-container" id="chatBox">
      <div class="msg ai">नमस्ते! मैं AI Studio Pro हूँ। आप मुझसे हिंदी या अंग्रेजी में गणित, विज्ञान, सामान्य ज्ञान या कोई भी सवाल पूछ सकते हैं!</div>
    </div>

    <!-- Input Bar -->
    <div class="input-bar">
      <button class="icon-btn" title="Add File" onclick="document.getElementById('fileInput').click()">＋</button>
      <input type="file" id="fileInput" style="display:none;" onchange="alert('फ़ाइल सेलेक्ट हो गई है!')">

      <input type="text" id="userInput" placeholder="कुछ भी पूछें (Ask anything)..." onkeypress="if(event.key==='Enter') processUserQuery()">

      <button class="icon-btn" id="micBtn" title="Voice Input" onclick="startVoice()">🎙️</button>
      <button class="send-btn" onclick="processUserQuery()">➤</button>
    </div>
  </div>

  <script>
    /* 1. Small Distant 3D Cube */
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });

    renderer.setSize(window.innerWidth, window.innerHeight);
    container.appendChild(renderer.domElement);

    const geometry = new THREE.BoxGeometry(0.7, 0.7, 0.7);
    const material = new THREE.MeshBasicMaterial({ color: 0x8b5cf6, wireframe: true });
    const cube = new THREE.Mesh(geometry, material);
    scene.add(cube);
    camera.position.z = 5;

    function animate() {
      requestAnimationFrame(animate);
      cube.rotation.x += 0.005;
      cube.rotation.y += 0.008;
      renderer.render(scene, camera);
    }
    animate();

    /* 2. Real Gemini AI Integration */
    const API_KEY = "YOUR_GEMINI_API_KEY"; // <-- यहाँ अपनी API Key डालें

    async function processUserQuery() {
      const input = document.getElementById('userInput');
      const text = input.value.trim();
      if (!text) return;

      addMessage(text, 'user');
      input.value = '';

      const loadingMsg = addMessage("सोच रहा हूँ...", 'ai');

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{
              parts: [{ text: "आप एक बुद्धिमान AI असिस्टेंट हैं। आपको गणित, भारत की जानकारी, विज्ञान और हिंदी-इंग्लिश भाषा का पूरा ज्ञान है। यूजर के सवाल का सही और सटीक जवाब दें:\n" + text }]
            }]
          })
        });

        const data = await response.json();
        const reply = data.candidates[0].content.parts[0].text;
        loadingMsg.innerText = reply;
      } catch (error) {
        loadingMsg.innerText = "माफ़ कीजिए, उत्तर प्राप्त करने में समस्या हुई। कृपया अपनी API Key जाँचें।";
      }
    }

    function addMessage(text, sender) {
      const chatBox = document.getElementById('chatBox');
      const msgDiv = document.createElement('div');
      msgDiv.className = `msg ${sender}`;
      msgDiv.innerText = text;
      chatBox.appendChild(msgDiv);
      chatBox.scrollTop = chatBox.scrollHeight;
      return msgDiv;
    }

    /* 3. Voice Input */
    function startVoice() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) return alert("वॉइस इनपुट सपोर्टेड नहीं है।");
      const recognition = new SpeechRecognition();
      recognition.lang = 'hi-IN';
      recognition.start();

      const micBtn = document.getElementById('micBtn');
      micBtn.style.color = '#ef4444';

      recognition.onresult = (e) => {
        document.getElementById('userInput').value = e.results[0][0].transcript;
        micBtn.style.color = '#9ca3af';
      };
      recognition.onerror = () => { micBtn.style.color = '#9ca3af'; };
      recognition.onend = () => { micBtn.style.color = '#9ca3af'; };
    }
  </script>
</body>
      </html>
