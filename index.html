<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Studio Pro</title>

  <!-- Three.js & Font Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
    body { background: #000000; color: #ffffff; height: 100vh; overflow: hidden; display: flex; }

    /* 3D Background Canvas */
    #canvas-container { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; pointer-events: none; }

    /* 1. LOGIN / SIGNUP OVERLAY */
    #auth-overlay {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.85); z-index: 999;
      display: flex; justify-content: center; align-items: center; padding: 20px;
    }
    .auth-card {
      background: rgba(18, 18, 24, 0.95); border: 1px solid #2a2a38;
      border-radius: 16px; padding: 25px; width: 100%; max-width: 350px;
      text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.8); z-index: 1000;
    }
    .auth-title { font-size: 1.4rem; font-weight: 700; color: #a855f7; margin-bottom: 5px; }
    .auth-sub { font-size: 0.8rem; color: #aaa; margin-bottom: 20px; }
    
    .social-btn {
      width: 100%; padding: 10px; margin-bottom: 8px; border-radius: 8px;
      border: 1px solid #333; background: #181822; color: #fff;
      font-size: 0.85rem; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .btn-google { background: #ffffff; color: #111; font-weight: 600; }
    .btn-fb { background: #1877f2; color: #fff; font-weight: 600; }
    
    .or-divider { margin: 12px 0; font-size: 0.75rem; color: #666; }
    
    .input-box {
      width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #333;
      background: #0d0d12; color: #fff; font-size: 0.85rem; margin-bottom: 8px; outline: none;
    }
    .btn-submit {
      width: 100%; padding: 10px; border-radius: 8px; border: none;
      background: #6366f1; color: #fff; font-weight: 600; cursor: pointer; margin-top: 4px;
    }

    /* 2. MAIN APP VIEW */
    #main-app {
      display: none; /* Hidden until login */
      position: relative; z-index: 10; flex-direction: column;
      width: 100%; height: 100vh; padding: 12px; max-width: 600px; margin: 0 auto;
    }

    /* Top Bar Header */
    .header { display: flex; align-items: center; justify-content: space-between; padding-bottom: 10px; border-bottom: 1px solid rgba(255,255,255,0.1); }
    .app-title { font-size: 1rem; font-weight: 700; color: #a855f7; }
    .top-actions { display: flex; gap: 8px; }
    .top-btn { background: #1a1a24; border: 1px solid #333; color: #ccc; padding: 5px 8px; border-radius: 6px; font-size: 0.75rem; cursor: pointer; }

    /* Chat Area */
    .chat-container { flex: 1; overflow-y: auto; padding: 12px 0; display: flex; flex-direction: column; gap: 8px; scrollbar-width: none; }
    .chat-container::-webkit-scrollbar { display: none; }

    .msg { max-width: 85%; padding: 8px 12px; border-radius: 12px; font-size: 0.82rem; line-height: 1.4; word-wrap: break-word; white-space: pre-wrap; }
    .msg.ai { background: rgba(22, 22, 32, 0.9); border: 1px solid #2e2e3d; align-self: flex-start; color: #d1d5db; }
    .msg.user { background: #6366f1; color: #fff; align-self: flex-end; border-bottom-right-radius: 2px; }

    /* Compact Input Bar */
    .input-bar {
      display: flex; align-items: center; gap: 6px; background: #12121a;
      padding: 6px 10px; border-radius: 25px; border: 1px solid #282836; margin-top: 5px;
    }
    .icon-btn { background: transparent; border: none; color: #9ca3af; font-size: 1.1rem; cursor: pointer; padding: 4px; display: flex; align-items: center; justify-content: center; }
    .input-bar input { flex: 1; background: transparent; border: none; outline: none; color: #fff; font-size: 0.85rem; padding: 4px 6px; }
    .send-btn { background: #6366f1; color: #fff; border: none; width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 0.8rem; }
  </style>
</head>
<body>

  <!-- 3D Canvas Background -->
  <div id="canvas-container"></div>

  <!-- 1. LOGIN OVERLAY -->
  <div id="auth-overlay">
    <div class="auth-card">
      <div class="auth-title">AI STUDIO PRO</div>
      <div class="auth-sub">Welcome! Please login to continue</div>

      <!-- Social Logins -->
      <button class="social-btn btn-google" onclick="loginSuccess()">Continue with Google</button>
      <button class="social-btn btn-fb" onclick="loginSuccess()">Continue with Facebook</button>

      <div class="or-divider">── OR ──</div>

      <!-- Phone / Email Login -->
      <input type="text" id="login-input" class="input-box" placeholder="Mobile Number or Email">
      <button class="btn-submit" onclick="sendOTP()">Send OTP</button>

      <div id="otp-section" style="display:none; margin-top: 8px;">
        <input type="text" id="otp-code" class="input-box" placeholder="Enter 6-digit OTP">
        <button class="btn-submit" style="background:#10b981;" onclick="loginSuccess()">Verify & Login</button>
      </div>
    </div>
  </div>

  <!-- 2. MAIN APPLICATION VIEW -->
  <div id="main-app">
    <!-- Header with Logout, Help & Support -->
    <div class="header">
      <div class="app-title">AI Studio Pro</div>
      <div class="top-actions">
        <button class="top-btn" onclick="alert('Help: Type your question or use voice input to ask anything.')">❓ Help</button>
        <button class="top-btn" onclick="alert('Support Email: support@aistudiopro.com')">🎧 Support</button>
        <button class="top-btn" style="color:#ef4444;" onclick="logout()">Logout</button>
      </div>
    </div>

    <!-- Chat Area -->
    <div class="chat-container" id="chatBox">
      <div class="msg ai">नमस्ते! मैं AI Studio Pro हूँ। मैं आपकी सहायता के लिए तैयार हूँ। मुझसे कुछ भी पूछें!</div>
    </div>

    <!-- Input Bar -->
    <div class="input-bar">
      <!-- Plus Button for Files -->
      <button class="icon-btn" title="Add File" onclick="document.getElementById('fileInput').click()">＋</button>
      <input type="file" id="fileInput" style="display:none;" onchange="alert('फाइल अटैच हो गई है!')">

      <!-- Text Input -->
      <input type="text" id="userInput" placeholder="Ask anything..." onkeypress="if(event.key==='Enter') processUserQuery()">

      <!-- Tap to Speak Mic Button -->
      <button class="icon-btn" id="micBtn" title="Tap to Speak" onclick="startVoice()">🎙️</button>

      <!-- Send Button -->
      <button class="send-btn" onclick="processUserQuery()">➤</button>
    </div>
  </div>

  <script>
    /* 1. THREE.JS: Small Distant 3D Cube with Canvas Text 'AI PRO' */
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });

    renderer.setSize(window.innerWidth, window.innerHeight);
    container.appendChild(renderer.domElement);

    // Create Canvas Texture for 'AI PRO' Text on Cube
    const textCanvas = document.createElement('canvas');
    textCanvas.width = 256; textCanvas.height = 256;
    const ctx = textCanvas.getContext('2d');
    ctx.fillStyle = '#0a0a10'; ctx.fillRect(0, 0, 256, 256);
    ctx.font = 'Bold 40px Arial'; ctx.fillStyle = '#a855f7'; ctx.textAlign = 'center';
    ctx.fillText('AI PRO', 128, 140);

    const texture = new THREE.CanvasTexture(textCanvas);
    const geometry = new THREE.BoxGeometry(0.7, 0.7, 0.7);
    const material = new THREE.MeshBasicMaterial({ map: texture });
    const cube = new THREE.Mesh(geometry, material);
    scene.add(cube);
    camera.position.z = 4.5;

    function animate() {
      requestAnimationFrame(animate);
      cube.rotation.x += 0.005;
      cube.rotation.y += 0.008;
      renderer.render(scene, camera);
    }
    animate();

    /* 2. Login & OTP Flow */
    function sendOTP() {
      const val = document.getElementById('login-input').value;
      if (!val) return alert('कृपया मोबाइल नंबर या ईमेल दर्ज करें!');
      document.getElementById('otp-section').style.display = 'block';
      alert('OTP भेज दिया गया है! (डेमो के लिए कोई भी 6 अंक डालें)');
    }

    function loginSuccess() {
      document.getElementById('auth-overlay').style.display = 'none';
      document.getElementById('main-app').style.display = 'flex';
    }

    function logout() {
      document.getElementById('auth-overlay').style.display = 'flex';
      document.getElementById('main-app').style.display = 'none';
      document.getElementById('otp-section').style.display = 'none';
    }

    /* 3. Chat System */
    function processUserQuery() {
      const input = document.getElementById('userInput');
      const text = input.value.trim();
      if (!text) return;

      addMessage(text, 'user');
      input.value = '';

      setTimeout(() => {
        let reply = getSmartResponse(text);
        addMessage(reply, 'ai');
      }, 400);
    }

    function getSmartResponse(q) {
      let query = q.toLowerCase();

      // Math Calculations
      if (/^[0-9+\-*/().\s^]+$/.test(q.replace(/×/g, '*').replace(/÷/g, '/'))) {
        try { return `गणित उत्तर: ${q} = ${eval(q.replace(/×/g, '*').replace(/÷/g, '/'))}`; } catch(e){}
      }

      if (query.includes("pm") || query.includes("प्रधानमंत्री") || query.includes("अभी कौन है")) {
        return "भारत के वर्तमान प्रधानमंत्री श्री नरेंद्र मोदी हैं।";
      }
      if (query.includes("राष्ट्रपति") || query.includes("president")) {
        return "भारत की वर्तमान राष्ट्रपति श्रीमती द्रौपदी मुर्मू हैं।";
      }
      if (query.includes("राज्य")) {
        return "भारत में कुल 28 राज्य और 8 केंद्र शासित प्रदेश हैं।";
      }

      return `आपका सवाल: "${q}"\n\nमैं आपकी सहायता के लिए तैयार हूँ। आप भारत, गणित, विज्ञान या भाषा से जुड़े सवाल पूछ सकते हैं।`;
    }

    function addMessage(text, sender) {
      const chatBox = document.getElementById('chatBox');
      const msgDiv = document.createElement('div');
      msgDiv.className = `msg ${sender}`;
      msgDiv.innerText = text;
      chatBox.appendChild(msgDiv);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    /* 4. Tap-to-Talk Mic Functionality */
    function startVoice() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) return alert("आपका ब्राउज़र वॉइस इनपुट सपोर्ट नहीं करता।");
      
      const recognition = new SpeechRecognition();
      recognition.lang = 'hi-IN';
      recognition.start();

      const micBtn = document.getElementById('micBtn');
      micBtn.style.color = '#ef4444'; // Red while listening

      recognition.onresult = (e) => {
        document.getElementById('userInput').value = e.results[0][0].transcript;
        micBtn.style.color = '#9ca3af';
      };
      recognition.onerror = () => { micBtn.style.color = '#9ca3af'; };
      recognition.onend = () => { micBtn.style.color = '#9ca3af'; };
    }
  </script>
</body>
  </html>
